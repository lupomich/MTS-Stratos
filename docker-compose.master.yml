# Docker Compose Master - MTS-Stratos Platform
# Uso: docker-compose -f docker-compose.master.yml up --build -d

services:
  # BondVision Backend API (porta 3000)
  bondvision-backend:
    build:
      context: ./bondvision-backend
      dockerfile: Dockerfile
    container_name: mts-stratos-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://stratos:stratos2026@postgres:5432/stratos_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=stratos-secret-key-2026
      - SESSION_IDLE_TIMEOUT_SECONDS=300
      - SESSION_ONLINE_TTL_SECONDS=315
      - CORS_ORIGIN=http://bondvision-digital:3002
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - mts-network
  # BondVision Digital - React + Vite (Node.js target on host port 3001)
  bondvision-digital:
    build:
      context: ./bondvision-digital
      dockerfile: Dockerfile.dev
    container_name: mts-stratos-bondvision-digital
    ports:
      - "3001:3001"
    volumes:
      - ./bondvision-digital/src:/app/src
      - ./bondvision-digital/public:/app/public
      - ./bondvision-digital/index.html:/app/index.html
    environment:
      - NODE_ENV=development
      - VITE_PORT=3001
      - VITE_BACKEND_TARGET=http://bondvision-backend:3000
      - VITE_BACKEND_URL=/api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - pgadmin
    networks:
      - mts-network

  # PostgreSQL Database (porta 5432)
  postgres:
    image: postgres:15-alpine
    container_name: mts-stratos-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=stratos
      - POSTGRES_PASSWORD=stratos2026
      - POSTGRES_DB=stratos_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - mts-network

  # Redis Cache (porta 6379)
  redis:
    image: redis:7-alpine
    container_name: mts-stratos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - mts-network

  # pgAdmin - Database UI (porta 5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mts-stratos-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@stratos.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - mts-network

  # E2E Tests with Playwright
  e2e:
    build:
      context: ./bondvision-digital
      dockerfile: Dockerfile.e2e
    container_name: mts-stratos-e2e
    command: sh -lc "tail -f /dev/null"
    environment:
      - API_BASE=http://bondvision-backend:3000/api
      - BASE_URL=http://bondvision-digital:3001
      - START_FROM=${START_FROM:-22}
    ports:
      - "9323:9323"
    restart: unless-stopped
    depends_on:
      - bondvision-backend
      - bondvision-digital
      - postgres
      - redis
    networks:
      - mts-network

networks:
  mts-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
